<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON//ASCENT</title>
    <style>
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .instructions {
            margin-top: 10px;
            font-size: 14px;
            color: #8b949e;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="1100" height="650"></canvas>
<div class="instructions">A/D: Move | W / W x2: Jump / Double Jump | Left Click: Shoot | Space: Dash | ESC: Pause</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const WIDTH = 1100;
const HEIGHT = 650;

let gameState = 0; // 0: Playing, 1: Paused, 2: Game Over
let score = 0;
let nextBossScore = 1000;
let bossActive = false;
let boss = null;

let keys = {};
let mousePressed = false;

window.addEventListener("keydown", e => {
    keys[e.code] = true;
    if (e.code === "KeyW") player.jump();
    if (e.code === "Space") player.dash();
    if (e.code === "Escape") {
        if (gameState === 0) gameState = 1;
        else if (gameState === 1) gameState = 0;
    }
    if (e.code === "KeyR" && gameState === 2) resetGame();
});
window.addEventListener("keyup", e => keys[e.code] = false);
window.addEventListener("mousedown", e => { if(e.button === 0) mousePressed = true; });
window.addEventListener("mouseup", e => { if(e.button === 0) mousePressed = false; });

const platforms = [
    {x: 0, y: 570, w: 1100, h: 80},
    {x: 120, y: 470, w: 250, h: 22},
    {x: 430, y: 390, w: 240, h: 22},
    {x: 750, y: 310, w: 220, h: 22},
    {x: 200, y: 280, w: 180, h: 22},
    {x: 480, y: 210, w: 200, h: 22},
    {x: 300, y: 130, w: 220, h: 22},
    {x: 600, y: 100, w: 200, h: 22}
];

class Player {
    constructor() {
        this.w = 36; this.h = 54;
        this.x = 120; this.y = 400;
        this.vx = 0; this.vy = 0;
        this.speed = 5.5;
        this.gravity = 0.75;
        this.jumpPower = -14;
        this.direction = 1;
        this.onGround = false;
        this.doubleJumpAvail = true; // Double jump restored
        this.maxHp = 100; this.hp = 100;
        this.invincible = 0;
        this.maxEnergy = 100; this.energy = 100;
        this.dashTimer = 0; this.dashCooldown = 0;
        this.shootCD = 0;
    }
    jump() {
        if (gameState !== 0) return;
        if (this.onGround) {
            this.vy = this.jumpPower;
            this.onGround = false;
            this.doubleJumpAvail = true;
        } else if (this.doubleJumpAvail) { // Double jump mechanics
            this.vy = this.jumpPower * 0.85;
            this.doubleJumpAvail = false;
        }
    }
    dash() {
        if (gameState !== 0) return;
        if (this.dashCooldown <= 0 && this.energy >= 25 && this.dashTimer <= 0) {
            this.energy -= 25;
            this.dashTimer = 7;
            this.dashCooldown = 40;
        }
    }
    shoot() {
        if (this.shootCD <= 0 && this.energy >= 5 && playerBullets.length < 6) {
            this.energy -= 5;
            this.shootCD = 12;
            let bx = this.direction === 1 ? this.x + this.w : this.x;
            playerBullets.push({x: bx, y: this.y + this.h/2, vx: 13 * this.direction, w: 14, h: 6});
        }
    }
    update() {
        if (this.dashTimer > 0) {
            this.x += 16 * this.direction;
            this.dashTimer--;
            return;
        }
        let moveX = 0;
        if (keys["KeyA"] || keys["ArrowLeft"]) { moveX -= this.speed; this.direction = -1; }
        if (keys["KeyD"] || keys["ArrowRight"]) { moveX += this.speed; this.direction = 1; }
        
        this.x += moveX;
        this.vy += this.gravity;
        this.y += this.vy;
        
        let oldBottom = this.y + this.h - this.vy;
        this.onGround = false;
        
        for (let p of platforms) {
            if (this.x < p.x + p.w && this.x + this.w > p.x &&
                this.y + this.h >= p.y && oldBottom <= p.y && this.vy >= 0) {
                this.y = p.y - this.h;
                this.vy = 0;
                this.onGround = true;
                this.doubleJumpAvail = true;
            }
        }
        
        if (this.x < 0) this.x = 0;
        if (this.x + this.w > WIDTH) this.x = WIDTH - this.w;
        if (this.y > HEIGHT + 100) { this.hp = 0; gameState = 2; }
        
        if (this.energy < this.maxEnergy) this.energy = Math.min(this.maxEnergy, this.energy + 0.2);
        if (this.invincible > 0) this.invincible--;
        if (this.dashCooldown > 0) this.dashCooldown--;
        if (this.shootCD > 0) this.shootCD--;
    }
}

class Boss {
    constructor() {
        this.w = 80; this.h = 54;
        this.x = WIDTH / 2 - 40; this.y = 80;
        this.maxHp = 500; this.hp = 500;
        this.speed = 2.2; this.dir = 1;
        this.attackTimer = 50;
        this.floatTime = 0;
        this.dead = false;
    }
    update() {
        if (this.dead) return;
        this.floatTime += 0.04;
        this.x += this.speed * this.dir;
        if (this.x <= 60 || this.x + this.w >= WIDTH - 60) this.dir *= -1;
        this.y = 70 + Math.sin(this.floatTime) * 25;
        
        this.attackTimer--;
        if (this.attackTimer <= 0) {
            let dx = player.x - this.x;
            let dy = player.y - this.y;
            let dist = Math.hypot(dx, dy) || 1;
            enemyBullets.push({x: this.x + this.w/2, y: this.y + this.h/2, vx: dx/dist*5, vy: dy/dist*5, r: 5});
            this.attackTimer = 40;
        }
        
        if (this.x < player.x + player.w && this.x + this.w > player.x && this.y < player.y + player.h && this.y + this.h > player.y) {
            if (player.invincible <= 0) { player.hp -= 15; player.invincible = 40; }
        }
    }
    draw() {
        if (this.dead) return;
        ctx.fillStyle = "#8c323c";
        ctx.fillRect(this.x, this.y, this.w, this.h);
        ctx.fillStyle = "#181c28";
        ctx.fillRect(this.x + 6, this.y + 6, this.w - 12, this.h - 12);
        ctx.fillStyle = "#e6cb50";
        ctx.beginPath();
        ctx.arc(this.x + this.w/2, this.y + this.h/2, 7, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = "#301e25";
        ctx.fillRect(WIDTH/2 - 150, 15, 300, 12);
        ctx.fillStyle = "#b43c3c";
        ctx.fillRect(WIDTH/2 - 150, 15, 300 * (this.hp / this.maxHp), 12);
        ctx.strokeStyle = "#e6edf3";
        ctx.strokeRect(WIDTH/2 - 150, 15, 300, 12);
    }
}

let player = new Player();
let enemies = [];
let playerBullets = [];
let enemyBullets = [];

function resetGame() {
    player = new Player();
    enemies = [{x: 300, y: 220, w: 38, h: 30, hp: 3, maxHp: 3, dir: 1, timer: 60, floatTime: 0}];
    playerBullets = [];
    enemyBullets = [];
    score = 0;
    nextBossScore = 1000;
    bossActive = false;
    boss = null;
    gameState = 0;
}

function gameLoop() {
    if (gameState === 0) {
        if (mousePressed) player.shoot();
        player.update();
        
        if (score >= nextBossScore && !bossActive) {
            bossActive = true;
            boss = new Boss();
            nextBossScore += 1000;
        }
        
        if (bossActive && boss) {
            boss.update();
            if (boss.hp <= 0) { bossActive = false; boss = null; score += 500; }
        }
        
        for (let e of enemies) {
            e.floatTime = (e.floatTime || 0) + 0.04;
            e.x += 1.5 * e.dir;
            if (e.x <= 30 || e.x >= WIDTH - 70) e.dir *= -1;
            e.y = 220 + Math.sin(e.floatTime) * 18;
            
            if (e.x < player.x + player.w && e.x + e.w > player.x && e.y < player.y + player.h && e.y + e.h > player.y) {
                if (player.invincible <= 0) { player.hp -= 10; player.invincible = 40; }
            }
        }
        
        for (let i = playerBullets.length - 1; i >= 0; i--) {
            let b = playerBullets[i];
            b.x += b.vx;
            if (b.x < 0 || b.x > WIDTH) { playerBullets.splice(i, 1); continue; }
            
            if (bossActive && boss && b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h) {
                boss.hp -= 1;
                score += 50;
                playerBullets.splice(i, 1);
                continue;
            }
            
            for (let j = enemies.length - 1; j >= 0; j--) {
                let e = enemies[j];
                if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                    e.hp--;
                    playerBullets.splice(i, 1);
                    if (e.hp <= 0) {
                        enemies.splice(j, 1);
                        score += 100;
                        setTimeout(() => {
                            if (!bossActive && enemies.length < 5) enemies.push({x: 400, y: 220, w: 38, h: 30, hp: 3, maxHp: 3, dir: 1, floatTime: 0});
                        }, 4000);
                    }
                    break;
                }
            }
        }
        
        if (player.hp <= 0) gameState = 2;
    }
    
    ctx.fillStyle = "#0f1219";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);
    
    ctx.fillStyle = "#161c2a";
    for (let p of platforms) {
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "#2896c8";
        ctx.fillRect(p.x, p.y, p.w, 2);
        ctx.fillStyle = "#161c2a";
    }
    
    if (player.invincible % 6 < 3) {
        ctx.fillStyle = "#2896c8";
        ctx.fillRect(player.x, player.y, player.w, player.h);
        ctx.fillStyle = "#181c28";
        ctx.fillRect(player.x + 5, player.y + 6, player.w - 10, player.h - 12);
    }
    
    // Draw Enemies (With Restored Eyes!)
    for (let e of enemies) {
        ctx.fillStyle = "#6e46a0";
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = "#181c28";
        ctx.fillRect(e.x + 4, e.y + 4, e.w - 8, e.h - 8);
        
        // Restored Enemy Eye Core
        ctx.fillStyle = "#b44678";
        ctx.beginPath();
        ctx.arc(e.x + e.w/2, e.y + e.h/2, 6, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.fillStyle = "#2896c8";
    for (let b of playerBullets) ctx.fillRect(b.x, b.y, b.w, b.h);
    
    if (bossActive && boss) boss.draw();
    
    ctx.fillStyle = "#e6edf3";
    ctx.font = "16px Consolas";
    ctx.fillText("HP: " + Math.max(0, player.hp), 20, 30);
    ctx.fillText("SCORE: " + score, WIDTH - 180, 30);
    
    if (gameState === 1) {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = "#2896c8";
        ctx.font = "50px Consolas";
        ctx.fillText("PAUSED", WIDTH/2 - 90, HEIGHT/2);
    } else if (gameState === 2) {
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.fillStyle = "#b43c3c";
        ctx.font = "50px Consolas";
        ctx.fillText("GAME OVER", WIDTH/2 - 130, HEIGHT/2 - 30);
        ctx.fillStyle = "#e6edf3";
        ctx.font = "22px Consolas";
        ctx.fillText("PRESS R TO RESTART", WIDTH/2 - 110, HEIGHT/2 + 20);
    }
    
    requestAnimationFrame(gameLoop);
}

resetGame();
gameLoop();
</script>

</body>
</html>
